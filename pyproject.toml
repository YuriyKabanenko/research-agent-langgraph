[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "langgraph-research-assistant"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "langgraph",
    "langgraph-checkpoint-postgres",
    "langchain",
    "langchain-core",
    "langchain-anthropic",
    "langchain-openai",
    "langchain-google-genai",
    "anthropic",
    "tavily-python",
    "python-dotenv",
    "pydantic",
    "fastapi",
    "uvicorn",
    "pillow",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "psycopg[binary,pool]",
    "alembic",
    "cryptography",
]

[tool.setuptools.packages.find]
include = ["research_assistant*", "server*"]
